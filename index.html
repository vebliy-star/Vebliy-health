<style>
:root{
  --bg:#0D1412; --surface:#151F1B; --surface2:#1B2823; --line:#26352E;
  --text:#EAF1EA; --muted:#8FA69A; --mint:#7ED8A4; --gold:#E9C46A;
  --radius:14px; --maxw:1100px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;font-weight:300;line-height:1.7;font-size:16px}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(13,20,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:'Fraunces',serif;font-weight:700;font-size:1.5rem;letter-spacing:.5px}
.logo span{color:var(--mint)}
.navlinks{display:flex;gap:22px;font-size:.85rem;color:var(--muted)}
.navlinks a:hover{color:var(--mint)}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;font-size:1rem;cursor:pointer}
.navright{display:flex;align-items:center;gap:12px}
#google_translate_element .goog-te-gadget{font-family:'Sora',sans-serif!important;font-size:0!important;color:transparent!important}
#google_translate_element .goog-te-combo{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.8rem;font-family:'Sora',sans-serif;max-width:150px}
body{top:0!important}
.goog-te-banner-frame{display:none!important}
@media(max-width:760px){
  .navlinks{display:none;position:absolute;top:64px;left:0;right:0;background:var(--surface);flex-direction:column;padding:18px 20px;gap:14px;border-bottom:1px solid var(--line)}
  .navlinks.open{display:flex}
  .menu-btn{display:block}
}

/* hero */
.hero{padding:60px 0 40px;border-bottom:1px solid var(--line)}
.eyebrow{color:var(--gold);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500;margin-bottom:14px}
.hero h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(2rem,5vw,3.2rem);line-height:1.15;max-width:720px}
.hero h1 em{font-style:normal;color:var(--mint);border-bottom:3px solid var(--gold)}
.hero p{color:var(--muted);max-width:560px;margin-top:16px}

/* category chips */
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 8px}
.chip{border:1px solid var(--line);border-radius:99px;padding:7px 16px;font-size:.8rem;color:var(--muted);cursor:pointer;background:none;font-family:inherit}
.chip:hover{border-color:var(--mint);color:var(--mint)}
.chip.active{background:var(--mint);color:#0D1412;border-color:var(--mint);font-weight:500}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;padding:34px 0 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:var(--mint)}
.card img{height:190px;width:100%;object-fit:cover}
.card .pad{padding:18px 20px 22px}
.card .cat{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);font-weight:500}
.card h3{font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;line-height:1.35;margin:8px 0 10px}
.card p{color:var(--muted);font-size:.88rem}
.card .date{color:var(--muted);font-size:.75rem;margin-top:14px;display:block}

/* article page */
.article{max-width:760px;margin:0 auto;padding:50px 20px 70px}
.article .cat{color:var(--gold);font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.article h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.2;margin:12px 0 10px}
.article .meta{color:var(--muted);font-size:.83rem;margin-bottom:26px}
.article .heroimg{border-radius:var(--radius);margin-bottom:30px;max-height:440px;width:100%;object-fit:cover}
.article .intro{font-size:1.05rem;color:var(--text)}
.article h2{font-family:'Fraunces',serif;font-weight:600;font-size:1.5rem;margin:40px 0 18px;color:var(--mint)}
.benefit{display:flex;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.benefit .num{font-family:'Fraunces',serif;color:var(--gold);font-weight:700;font-size:1.4rem;line-height:1;min-width:34px}
.benefit h4{font-weight:500;font-size:1rem;margin-bottom:5px}
.benefit p{color:var(--muted);font-size:.9rem}
.precaution{background:var(--surface2);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:14px 18px;margin-bottom:10px;color:var(--muted);font-size:.92rem}
.article .outro{margin-top:26px;color:var(--text)}
.backlink{display:inline-block;margin-bottom:26px;color:var(--mint);font-size:.85rem}
.adslot{margin:36px 0;text-align:center}

/* static pages */
.page{max-width:760px;margin:0 auto;padding:50px 20px 70px}
.page h1{font-family:'Fraunces',serif;font-weight:600;font-size:2.1rem;margin-bottom:22px}
.page h2{font-family:'Fraunces',serif;font-weight:600;font-size:1.25rem;margin:28px 0 10px;color:var(--mint)}
.page p{color:var(--muted);margin-bottom:14px}
.page strong{color:var(--text);font-weight:500}

/* footer */
footer{border-top:1px solid var(--line);padding:34px 0 44px;margin-top:20px}
.foot{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center;color:var(--muted);font-size:.82rem}
.foot .links{display:flex;gap:18px;flex-wrap:wrap}
.foot a:hover{color:var(--mint)}
.empty{color:var(--muted);padding:40px 0;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style>

const app = document.getElementById('app');

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function cardHTML(a){
  return `<a class="card" href="#/article/${a.id}">
    <img src="${a.image}" alt="${esc(a.title)}" loading="lazy">
    <div class="pad">
      <span class="cat">${esc(a.category)}</span>
      <h3>${esc(a.title)}</h3>
      <p>${esc(a.excerpt)}</p>
      <span class="date">${esc(a.date)}</span>
    </div></a>`;
}

function renderHome(cat){
  const cats = ['All', ...new Set(ARTICLES.map(a=>a.category))];
  const list = (!cat||cat==='All') ? ARTICLES : ARTICLES.filter(a=>a.category===cat);
  app.innerHTML = `
  <section class="hero"><div class="wrap">
    <div class="eyebrow">Health · Fitness · Wellness</div>
    <h1>Your health journey, made <em>simple</em>.</h1>
    <p>Easy articles on healthy foods, exercise, home remedies and daily habits — with clear benefits and precautions you can actually use.</p>
    <div class="chips">${cats.map(c=>`<button class="chip ${((!cat&&c==='All')||cat===c)?'active':''}" onclick="location.hash='${c==='All'?'#/':'#/category/'+c}'">${c}</button>`).join('')}</div>
  </div></section>
  <div class="wrap"><div class="grid">${list.length?list.map(cardHTML).join(''):'<div class="empty">No articles in this category yet.</div>'}</div></div>`;
  document.title = "Vebliy — Health & Fitness Made Simple";
  window.scrollTo(0,0);
}

function renderArticle(id){
  const a = ARTICLES.find(x=>String(x.id)===String(id));
  if(!a){ renderHome(); return; }
  app.innerHTML = `<article class="article">
    <a class="backlink" href="#/">← Back to all articles</a>
    <div class="cat">${esc(a.category)}</div>
    <h1>${esc(a.title)}</h1>
    <div class="meta">${esc(a.date)} · Vebliy Team</div>
    <img class="heroimg" src="${a.image}" alt="${esc(a.title)}">
    <p class="intro">${esc(a.intro)}</p>
    <div class="adslot"><!-- AD SLOT: AdSense in-article ad code yahan paste kar sakte ho --></div>

    ${a.benefits.map((b,i)=>`<div class="benefit"><div class="num">${String(i+1).padStart(2,'0')}</div><div><h4>${esc(b.t)}</h4><p>${esc(b.d)}</p></div></div>`).join('')}

  document.title = a.title + " — Vebliy";

function renderPage(key){
  if(!PAGES[key]){ renderHome(); return; }
  app.innerHTML = `<div class="page">${PAGES[key].replaceAll('EMAIL', SITE_EMAIL)}</div>`;
  document.title = key.charAt(0).toUpperCase()+key.slice(1) + " — Vebliy";
  window.scrollTo(0,0);
}

function route(){
  const h = decodeURIComponent(location.hash || '#/');
  if(h.startsWith('#/article/')) renderArticle(h.split('/')[2]);
  else if(h.startsWith('#/category/')) renderHome(h.split('/')[2]);
  else if(h==='#/about') renderPage('about');
  else if(h==='#/contact') renderPage('contact');
  else if(h==='#/privacy') renderPage('privacy');
  else if(h==='#/disclaimer') renderPage('disclaimer');
  else renderHome();
}
window.addEventListener('hashchange', route);
route();
