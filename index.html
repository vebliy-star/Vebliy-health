.page strong{color:var(--text);font-weight:500}

/* footer */
footer{border-top:1px solid var(--line);padding:34px 0 44px;margin-top:20px}
.foot{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center;color:var(--muted);font-size:.82rem}
.foot .links{display:flex;gap:18px;flex-wrap:wrap}
.foot a:hover{color:var(--mint)}
.empty{color:var(--muted);padding:40px 0;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}

/* ---------------- ROUTER (isko change karne ki zaroorat nahi) ---------------- */
const app = document.getElementById('app');
document.getElementById('year').textContent = new Date().getFullYear();

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function cardHTML(a){
  return `<a class="card" href="#/article/${a.id}">
    ${okimg(a.image)?`<img src="${a.image}" alt="${esc(a.title)}" loading="lazy">`:''}
    <div class="pad">
      <span class="cat">${esc(a.category)}</span>
      <h3>${esc(a.title)}</h3>
      <p>${esc(a.excerpt)}</p>
      <span class="date">${esc(a.date)}</span>
    </div></a>`;
}

const CATEGORIES = ['All','Benefits','Beauty & Hair','Home Remedies','Diet & Fitness','Exercise'];

function searchScore(a,q){
  let s=0;
  const inText=(txt,w)=>{ if(txt && txt.toLowerCase().includes(q)) s+=w; };
  inText(a.title,5); inText(a.category,3); inText(a.excerpt,2); inText(a.intro,1);
  (a.benefits||[]).forEach(b=>{ inText(b.t,2); inText(b.d,1); });
  inText(a.howto,1); inText(a.outro,1);
  return s;
}

function doSearch(v){
  const grid=document.getElementById('grid');
  if(!grid) return;
  const q=v.trim().toLowerCase();
  if(!q){ grid.innerHTML = window._curList.map(cardHTML).join(''); return; }
  const results = ARTICLES.map(a=>({a,s:searchScore(a,q)})).filter(x=>x.s>0).sort((x,y)=>y.s-x.s).map(x=>x.a);
  grid.innerHTML = results.length ? results.map(cardHTML).join('') : '<div class="empty">No articles found for "'+esc(v)+'". Try another word.</div>';
}

function renderHome(cat){
  const list = (!cat||cat==='All') ? ARTICLES : ARTICLES.filter(a=>a.category===cat);
  window._curList = list;
  app.innerHTML = `
  <section class="hero"><div class="wrap">
    <div class="eyebrow">Health · Fitness · Wellness</div>
    <h1>Your health journey, made <em>simple</em>.</h1>
    <p>Easy articles on healthy foods, beauty uses, home remedies, diet and exercise — with clear benefits and precautions you can actually use.</p>
    <div class="searchbox"><span class="sicon">🔍</span><input type="search" placeholder="Search articles... (e.g. banana, green tea, haldi)" oninput="doSearch(this.value)"></div>
    <div class="chips">${CATEGORIES.map(c=>`<button class="chip ${((!cat&&c==='All')||cat===c)?'active':''}" onclick="location.hash='${c==='All'?'#/':'#/category/'+c}'">${c}</button>`).join('')}</div>
  </div></section>
  <div class="wrap"><div class="grid" id="grid">${list.length?list.map(cardHTML).join(''):'<div class="empty">No articles in this category yet.</div>'}</div></div>`;
  document.title = "Vebliy — Health & Fitness Made Simple";
  setMeta("Vebliy is a health and fitness blog with easy articles on healthy foods, beauty uses, home remedies, diet and exercise — with photos, benefits and precautions.");
  window.scrollTo(0,0);
}

function setMeta(d){
  const m=document.querySelector('meta[name="description"]');
  if(m) m.setAttribute('content', d);
}

function okimg(u){return typeof u==='string' && u.startsWith('http')}
function secimg(u,alt){return okimg(u)?`<img class="secimg" src="${u}" alt="${esc(alt)}" loading="lazy">`:''}

function renderArticle(id){
  const a = ARTICLES.find(x=>String(x.id)===String(id));
  if(!a){ renderHome(); return; }
  const bens = a.benefits||[];
  const half = Math.ceil(bens.length/2);
  const benHTML = (arr,start)=>arr.map((b,i)=>`<div class="benefit"><div class="num">${String(start+i+1).padStart(2,'0')}</div><div><h4>${esc(b.t)}</h4><p>${esc(b.d)}</p></div></div>`).join('');
  app.innerHTML = `<article class="article">
    <a class="backlink" href="#/">← Back to all articles</a>
    <div class="cat">${esc(a.category)}</div>
    <h1>${esc(a.title)}</h1>
    <div class="meta">${esc(a.date)} · Vebliy Team</div>
    ${okimg(a.image)?`<img class="heroimg" src="${a.image}" alt="${esc(a.title)}">`:''}
    <p class="intro">${esc(a.intro)}</p>
    ${secimg(a.introImage, a.title)}
    <div class="adslot"><!-- AD SLOT: AdSense in-article ad code yahan paste kar sakte ho --></div>
    <h2>Benefits</h2>
    ${secimg(a.benefitsImage, a.title)}
    ${benHTML(bens.slice(0,half),0)}
    ${secimg(a.benefitsImage2, a.title)}
    ${benHTML(bens.slice(half),half)}
    ${a.precautions&&a.precautions.length?`<h2>Precautions</h2>${secimg(a.precautionsImage, a.title)}${a.precautions.map(p=>`<div class="precaution">${esc(p)}</div>`).join('')}`:''}
    ${a.howto?`<h2>${esc(a.howtoTitle||'How to Use')}</h2>${secimg(a.howtoImage, a.title)}<p class="outro">${esc(a.howto)}</p>`:''}
    <p class="outro">${esc(a.outro||'')}</p>
    <div class="adslot"><!-- AD SLOT --></div>
  </article>`;
  document.title = a.title + " — Vebliy";
  setMeta(a.excerpt || a.intro.slice(0,155));
  window.scrollTo(0,0);
}

function renderPage(key){
  if(!PAGES[key]){ renderHome(); return; }
  app.innerHTML = `<div class="page">${PAGES[key].replaceAll('EMAIL', SITE_EMAIL)}</div>`;
  document.title = key.charAt(0).toUpperCase()+key.slice(1) + " — Vebliy";
  window.scrollTo(0,0);
}

function route(){
  const h = decodeURIComponent(location.hash || '#/');
  if(h.startsWith('#/article/')) renderArticle(h.split('/')[2]);
  else if(h.startsWith('#/category/')) renderHome(h.split('/')[2]);
  else if(h==='#/about') renderPage('about');
  else if(h==='#/contact') renderPage('contact');
  else if(h==='#/privacy') renderPage('privacy');
  else if(h==='#/disclaimer') renderPage('disclaimer');
  else renderHome();
}
window.addEventListener('hashchange', route);
route();

/* ---------- GOOGLE TRANSLATE (custom small dropdown, Google's own widget stays hidden) ---------- */
function googleTranslateElementInit(){
  new google.translate.TranslateElement({
    pageLanguage:'en',
    includedLanguages:'hi,bn,ta,te,mr,gu,kn,ml,pa,ur,en,es,fr,de,pt,ar,ru,ja,zh-CN,id',
    layout:google.translate.TranslateElement.InlineLayout.SIMPLE
  },'google_translate_element');
}

function changeLang(lang){
  const val = lang==='en' ? '' : '/en/'+lang;
  document.cookie = 'googtrans='+val+'; path=/';
  document.cookie = 'googtrans='+val+'; domain='+location.hostname+'; path=/';
  location.reload();
}

(function restoreLangSelection(){
  const m = document.cookie.match(/googtrans=\/en\/([a-zA-Z-]+)/);
  if(m){
    window.addEventListener('DOMContentLoaded', function(){
      const sel = document.getElementById('langSelect');
      if(sel) sel.value = m[1];
    });
  }
})();

/* Google's script re-injects the top translate banner with inline styles on a timer,
   so plain CSS isn't always enough — force it hidden repeatedly for a few seconds. */
(function forceHideGoogleBanner(){
  let tries = 0;
  const kill = setInterval(function(){
    tries++;
    const frame = document.querySelector('.goog-te-banner-frame');
    if(frame){ frame.style.setProperty('display','none','important'); }
    document.body.style.setProperty('top','0px','important');
    document.documentElement.style.setProperty('top','0px','important');
    const tt = document.getElementById('goog-gt-tt');
    if(tt){ tt.style.setProperty('display','none','important'); }
    if(tries > 40) clearInterval(kill); // stop after ~12 seconds
  }, 300);
})();
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
